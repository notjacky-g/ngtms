	<div id="hzMemberTab" style="display: block;padding: 0px 5px;">
		<p class="header">HZ Group Members:</p>
		<div id="hzMemberGrid"></div>
		<p class="header">HZ Group Clients:</p>
		<div id="hzClientGrid"></div>
		<script th:inline="javascript">
			/*<![CDATA[*/
			$('#hzMemberGrid').w2grid({
				name   : 'hzMemberGrid',
				recordHeight:32,
				recid:"address",
				fixedBody:false,
				columns: [
					{ field: 'address', caption: 'Address', size: '180px', sortable: true,title:''},
					{ field: 'coordinator', caption: 'Coordinator', size: '100px',title:''},
					{ field: 'localMember', caption: 'LocalMember', size: '110px',title:''},
					{ field: 'uuid', caption: 'UUID', size: '300px',title:''},
					{ field: 'attributes', caption: 'Attributes', size: '100%', sortable: true,title:''}
				],
				sortData: [{ field: 'address', direction: 'asc' }],
			});
			$('#hzClientGrid').w2grid({
				name   : 'hzClientGrid',
				recid:"address",
				fixedBody:false,
				columns: [
					{ field: 'address', caption: 'Address', size: '180px', sortable: true,title:''},
					{ field: 'client', caption: 'Client Info', size: '100%',title:''},
				],
				sortData: [{ field: 'address', direction: 'asc' }]
			});
			$.get("hcConsole/hzMemberData", hzMemberOnloadData);
			function hzMemberOnloadData(data,status){
				$("#tabsContentTimestamp").text(data.timestamp);
				w2ui['hzMemberGrid'].add(data.members);
				w2ui['hzClientGrid'].add(data.clients);
			}
			function hzMemberTabOnVisible(visiable){
				if(visiable) hzMemberTabOnRefresh();
				else{
					w2ui['hzMemberGrid'].clear();
					w2ui['hzClientGrid'].clear();
				}
			}

			function hzMemberTabOnRefresh(){
				w2ui['hzMemberGrid'].clear();
				w2ui['hzClientGrid'].clear();
				$.get("hcConsole/hzMemberData", hzMemberOnloadData);
			}
			/*]]>*/
		</script>
	</div>

				$("#hzConfigDiv").text(data.hzConfig);

	<div id="sysPerfLogTab" style="display: none;padding: 0px 5px;">
		<div id="sysPerfLogLayout"></div>
		<script th:inline="javascript">
			$().w2layout({
		        name: 'sysPerfLogLayout',
		        panels: [
		            { type: 'left', size: 300, resizable: true, title:'功能模組列表' },
		            { type: 'main', style: 'background-color: white;', content:
		            	'<div id="popupTool">'
				    		+'Time milliseconds <input type="text" size="12" onchange="long2Date(this.value,\'#sysPerfLogTab #dateString\')"/>'
				    		+'to date: <input id="dateString" type="text" readonly="readonly"/>'
				    	+'</div>'
		            	+'<div id="sysPerfLogGrid"></div>'}
		        ]
		    });
	
			// sidebar
			w2ui['sysPerfLogLayout'].content('left', $().w2sidebar({
		    	name: 'sysPerfLogSidebar',
		    	img: null,
		    	onClick: function (event) {
		    		w2ui['sysPerfLogGrid'].clear();
		    		loadModuleLogs(event.target);
		    	}
		    }));
			$().w2grid({
				    name   : 'sysPerfLogGrid',
				    recid:"id",
				    recordHeight: 32,
				    show: {
				        toolbar: true,
				        footer: true,
				    },
				    columns: [
						{ field: 'id', caption: 'ID', size: '70px', sortable: true,title:''},
						{ field: 'jobName', caption: 'JobName', size: '150px', sortable: true},
						{ field: 'time', caption: 'Time', size: '160px',title:''},
						{ field: 'description', caption: 'Description', size: '180px',title:''},
						{ field: 'counters', caption: 'Counters', size: '100%',title:''}
					],
		 			sortData: [{ field: 'jobName', direction: 'asc' }],
		 			onReload: function(event) {
		 				w2ui['sysPerfLogGrid'].clear();
		 				loadModuleLogs(curSysPerLogModuleName);
		 		    }
			});
			var curSysPerLogModuleName=null;
			function loadModuleLogs(moduleName){
				curSysPerLogModuleName=moduleName;
				$.get("sysPerfLog/moduleLogs",{name: moduleName},function (data,status){
	    			$("#tabsContentTimestamp").text(data.timestamp);
	    			var sysPerfLogs=data.sysPerfLogs;
	    			<!-- 不知道為什麼，在這裡用 for(var i=0;i<sysPerfLogs.length;i++) 會在 parse 的時候 fail -->
					for(var index in sysPerfLogs){
						var sysPerfLog = sysPerfLogs[index];
						var log=sysPerfLog;
	    				var html='';
	    				for(var counter in log.counterMap) {
	    					var chtml='<span class="counterName">'+counter+':</span><span class="counterValue">'+log.counterMap[counter]+'</span>';
	    					html+=chtml;
	    				}
	    				sysPerfLog.counters=html;
	    				html='';
	    				if(log.startTime){
	    					html=html+log.startTime;
	    					if(log.endTime) html+=' ~ '+log.endTime;
	    				}
	    				sysPerfLog.time=html;
	    				if(log.issueAlarm) sysPerfLog.style='color: red';
					}
	    			
	    			w2ui['sysPerfLogGrid'].add(sysPerfLogs);
	    		},"json");
			}
			function sysPerfLogOnloadData(data,status){
				$("#tabsContentTimestamp").text(data.timestamp);
				var moduleNames=data.moduleNames;
				var nodes=[];
				<!-- 不知道為什麼，在這裡用 for(var i=0;i<moduleNames.length;i++) 會在 parse 的時候 fail -->
				for(var index in moduleNames){
					nodes.push({id:moduleNames[index], text:moduleNames[index],img: 'icon-page'});
				}
				w2ui['sysPerfLogSidebar'].add(nodes);
			}
			function sysPerfLogTabOnVisible(visiable){
				if(visiable){
					if(!sysPerfLogInit){
						$('#sysPerfLogLayout').w2render('sysPerfLogLayout');
						$('#sysPerfLogGrid').w2render('sysPerfLogGrid');
						sysPerfLogInit=true;
					}
					w2ui['sysPerfLogLayout'].resize();
					sysPerfLogTabOnRefresh();
				}
			}
			var sysPerfLogInit=false;
			function sysPerfLogTabOnRefresh(){
				w2ui['sysPerfLogSidebar'].nodes=[];
				w2ui['sysPerfLogSidebar'].refresh();
				$.get("sysPerfLog/sidebarData",sysPerfLogOnloadData);
			}
		</script>
	</div>

		<script th:inline="javascript">
			/*<![CDATA[*/
			$('#hzDistObjGrid').w2grid({
				name   : 'hzDistObjGrid',
				recid:"name",
				recordHeight: 32,
				show: {
					toolbar: true,
					lineNumbers: true,
					footer: true
				},
				columns: [
					{ field: 'name', caption: 'Name', size: '350px', sortable: true,title:''},
					{ field: 'size', caption: 'Size', size: '70px', sortable: true,title:''},
					{ field: 'hzClient', caption: 'HzClient', size: '80px',hidden: true,title:''},
					{ field: 'local', caption: 'Local', size: '60px',hidden: true,title:''},
					{ field: 'predicate', caption: 'Predicate', size: '190px',hidden: true,title:''},
					{ field: 'query', caption: 'Query', size: '100px',title:''},
					{ field: 'performance', caption: 'Performance', size: '110px',title:''},

					{ field: 'comment', caption: 'Comment', size: '100%',title:''}
				],
				sortData: [{ field: 'name', direction: 'asc' }],
				onReload: function(event) {
					hzDumpTabOnRefresh();
				}
			});
			function getDistObjDetail(type,name,id){
				switch(type){
				case "IMap":
					var predicate=$('#hzDistObjGrid #p'+id).val();
					var useHzClient=$('#hzDistObjGrid #c'+id).prop('checked');
					var useLocal=$('#hzDistObjGrid #l'+id).prop('checked');
					$('#hzDistObjPopup').w2popup('open',{
						title   : type+" : "+name+(predicate? ", predecate: "+predicate:"")
							+(useHzClient? ", use Hz Client":"")+(useLocal? ", use Local":""),
						showMax : true,
						width   : 1200,
						height  : 800,
						onOpen  : function (event) {
							event.onComplete = function () {
								$('#w2ui-popup #hzDistObjPopupGrid').w2render('hzMapGrid');
								//console.log("useHzClient:"+useHzClient);
								hzMapOnRefresh(type+"?name="+name,predicate,useHzClient,useLocal);
							};
						},
						onClose : function (event) {
							event.onComplete = function () {
								w2ui['hzMapGrid'].clear();
							}
						},
						onToggle: function (event) {
							event.onComplete = function () {
								w2ui['hzMapGrid'].resize();
							}
						}
					});

					break;
				case "IQueue":
					$('#hzDistObjPopup').w2popup('open',{
						title   : type+" : "+name,
						showMax : true,
						width   : 1200,
						height  : 800,
						onOpen  : function (event) {
							event.onComplete = function () {
								$('#w2ui-popup #hzDistObjPopupGrid').w2render('hzQueueGrid');
								hzQueueOnRefresh(type+"?name="+name);
							};
						},
						onClose : function (event) {
							event.onComplete = function () {
								w2ui['hzQueueGrid'].clear();
							}
						},
						onToggle: function (event) {
							event.onComplete = function () {
								w2ui['hzQueueGrid'].resize();
							}
						}
					});
					break;
				case "ILock":
					$('#hzInfoPopup').w2popup('open',{
						title   : type+" : "+name,
						width   : 500,
						height  : 300,
						onOpen  : function (event) {
							event.onComplete = function () {
								hzLockOnRefresh(type+"?name="+name);
							};
						},
					});
					break;
				case "ITopic":
					$('#hzTopicPopup').w2popup('open',{
						title   : type+" : "+name,
						showMax : true,
						width   : 1200,
						height  : 800,
						onOpen  : function (event) {
							event.onComplete = function () {
								hzTopicOnVisible(true,name);
							};
						},
						onClose : function (event) {
							event.onComplete = function () {
								hzTopicOnVisible(false);
							}
						},
					});
					break;
				default:
					break;;
				}

			}
			function getDistObjPerformance(type,name){
				$('#hzInfoPopup').w2popup('open',{
					title   : type+" : "+name,
					showMax : true,
					width   : 700,
					height  : 500,
					onOpen  : function (event) {
						event.onComplete = function () {
							hzPerformanceOnRefresh('performance?type='+type+'&name=' +name);
						};
					},
				});
			}
			function getDistObjDestroy(type,name){
				w2confirm('Destroy and recreate '+type+" : "+name+' ?', function (btn) {
					if(btn=='Yes'){
						$('#hzInfoPopup').w2popup('open',{
							title   : type+" : "+name,
							width   : 500,
							height  : 300,
							onOpen  : function (event) {
								event.onComplete = function () {
									hzDeleteOnRefresh("destroyRecreateDistObj?type="+type+"&name="+name);
								};
							},
						});
					}
				});
			}
			function long2Date(time,id){
				var date=new Date(Number(time));
				if(!id) id='#w2ui-popup #dateString';
				$(id).val(date.toLocaleString()+"."+(1000+date.getMilliseconds()).toString().substr(1));
			}
			function hzDumpOnloadData(data,status){
				$("#tabsContentTimestamp").text(data.timestamp);
				var distObjs=data.distObjs;
				for(var i=0;i<distObjs.length;i++){
					var distObj=distObjs[i];
					if(distObj.size<0) distObj.size=null;

					if(distObj.predicate) {
						distObj.predicate='<input type="text" id="p'+i+'"></input>';
						distObj.hzClient='<input type="checkbox" id="c'+i+'"></input>';
						distObj.local='<input type="checkbox" id="l'+i+'"></input>';
					}
					else {
						distObj.predicate=null;
						distObj.hzClient=null;
					}
					if(distObj.query) distObj.query='<a onclick="getDistObjDetail(\''+distObj.type+'\',\''+distObj.name+'\','+i+');">Get Detail</a>';
					else distObj.query=null;
					if(distObj.performance)	distObj.performance='<a onclick="getDistObjPerformance(\''+distObj.type+'\',\''+distObj.name+'\')">Display</a>';
					else distObj.performance=null;
					if(distObj.destroy)	distObj.destroy='<a onclick="getDistObjDestroy(\''+distObj.type+'\',\''+distObj.name+'\')">Exec</a>';
					else distObj.destroy=null;
					distObj.name=distObj.type+" : "+distObj.name;
				}
				w2ui['hzDistObjGrid'].add(distObjs);
				w2ui['hzDistObjGrid'].unlock();
			}
			function hzDumpTabOnVisible(visiable){
				if(visiable) hzDumpTabOnRefresh();
				else{
					w2ui['hzDistObjGrid'].clear();
				}
			}

			function hzDumpTabOnRefresh(){
				w2ui['hzDistObjGrid'].lock('Loading....',true);
				w2ui['hzDistObjGrid'].clear();
				$.get("hcConsole/hzDistObjData", hzDumpOnloadData);
			}
			/*]]>*/
		</script>
	</div>

<div id="hzDistObjPopup" style="display: none;padding: 0px 5px;width: 100%; height: 100%">
	<div id="popupTool">
		Time milliseconds <input type="text" size="12" onchange="long2Date(this.value)"/>
		to date: <input id="dateString" type="text" readonly="readonly"/>
		<div id="popupContentTimestampDiv"><span id="tabsContentTimestamp"></span></div>
	</div>
	<div id="hzDistObjPopupGrid"></div>
</div>
<div id="hzInfoPopup" style="display: none;padding: 0px 5px;width: 100%; height: 100%">
	<div id="popupTool">
		<div id="popupContentTimestampDiv"><span id="tabsContentTimestamp"></span></div>
	</div>
	<pre id="hzInfo"></pre>
</div>
<div id="hzTopicPopup" style="display: none;padding: 0px 5px;width: 100%; height: 100%">
	<div id="popupTool">
		Time milliseconds <input type="text" size="12" onchange="long2Date(this.value)"/>
		to date: <input id="dateString" type="text" readonly="readonly"/>
		<button id="hzTopicClear" onclick="clearHzTopicResult()">Clear</button>
	</div>
	<ol id="hzTopicData"></ol>
</div>

	<script th:inline="javascript">
		/*<![CDATA[*/
		// hzMap
		var hzMapUrl;
		$().w2grid({
			name   : 'hzMapGrid',
			recid:"key",
			recordHeight: 64,
			show: {
				toolbar: true,
				lineNumbers: true,
				footer: true
			},
			columns: [
				{ field: 'key', caption: 'Key', size: '150px', sortable: true,title:''},
				{ field: 'value', caption: 'Value', size: '100%',title:''}
			],
			sortData: [{ field: 'key', direction: 'asc' }],
			onReload: function(event) {
				hzMapOnRefresh();
			}
		});

		function hzMapOnloadData(data,status){
			$("#w2ui-popup #tabsContentTimestamp").text(data.timestamp);
			var dataMap=data.dataMap;
			var records=[];
			for(var key in dataMap){
				records.push({key:key,value:dataMap[key]});
			}
			w2ui['hzMapGrid'].add(records);
			w2ui['hzMapGrid'].unlock();
		}
		function hzMapOnRefresh(url,p,c,l){
			if(url) {
				hzMapUrl=url;
				if(p) {
					hzMapUrl=hzMapUrl+'&predicate='+p;
				}
				if(c){
					hzMapUrl=hzMapUrl+'&useHzClient='+c;
				}
				if(l){
					hzMapUrl=hzMapUrl+'&useLocal='+l;
				}
			}
			w2ui['hzMapGrid'].lock('Loading....',true);
			w2ui['hzMapGrid'].clear();
			$.get("hcConsole/"+hzMapUrl, hzMapOnloadData);
		}

		// hzQueue
		var hzQueueUrl;
		$().w2grid({
			name   : 'hzQueueGrid',
			recid:"index",
			recordHeight: 32,
			show: {
				toolbar: true,
				lineNumbers: true,
				footer: true
			},
			toolbar: {
				items: [
					{ id: 'clear', type: 'button', caption: 'Clear Queue',  }
				],
				onClick: function (event) {
					if (event.target == 'clear') {
						w2confirm('Clear this queue?', function (btn) {
							if(btn=='Yes'){
								hzQueueOnRefresh(null,true);
							}
						});
					}
				}
			},
			columns: [
				{ field: 'index', caption: 'Index', size: '80px', sortable: true,title:''},
				{ field: 'value', caption: 'Value', size: '100%',title:''}
			],
			sortData: [{ field: 'index', direction: 'asc' }],
			onReload: function(event) {
				hzQueueOnRefresh();
			}
		});

		function hzQueueOnloadData(data,status){
			$("#w2ui-popup #tabsContentTimestamp").text(data.timestamp);
			var dataList=data.dataList;
			var records=[];
			for(var i=0;i<dataList.length;i++){
				records.push({index:i,value:dataList[i]});
			}
			w2ui['hzQueueGrid'].add(records);
			w2ui['hzQueueGrid'].unlock();
		}
		function hzQueueOnRefresh(url,clear){
			if(url) {
				hzQueueUrl=url;
			}
			w2ui['hzQueueGrid'].lock('Loading....',true);
			w2ui['hzQueueGrid'].clear();
			$.get("hcConsole/"+hzQueueUrl+(clear? "&clear=true":""), hzQueueOnloadData);
		}
		// hzTopic
		var hzTopicCount=0;
		var hzTopicSocket;
		function hzTopicOnVisible(visible,name){
			if(visible){
				var url= (location.protocol=="http:"? "ws://":"wss://") +location.hostname+":"+
				location.port+ "<%=request.getContextPath()%>/hcConsole/topicMessage";
				hzTopicSocket = new WebSocket(url);
				hzTopicSocket.onopen = function() {
					$("#w2ui-popup #hzTopicData").append('<li>WS OnOpen</li>');
					hzTopicSocket.send(name);
				};

				hzTopicSocket.onmessage = function(message) {
					$("#w2ui-popup #hzTopicData").append('<li>'+message.data+'</li>');
				};

				hzTopicSocket.onclose = function() {
					$("#w2ui-popup #hzTopicData").append('<li>WS OnClose</li>');
				}

				hzTopicSocket.onerror = function() {
					$("#w2ui-popup #hzTopicData").append('<li>WS OnError</li>');
				}
			}
			else{
				hzTopicSocket.close();
			}
		}
		function clearHzTopicResult(){
			$("#w2ui-popup #hzTopicData").empty();
		}
		// hzLock
		function hzLockOnloadData(data,status){
			$("#w2ui-popup #tabsContentTimestamp").text(data.timestamp);
			$("#w2ui-popup #hzInfo").text(JSON.stringify(data.ilockInfo,null,2));
		}
		function hzLockOnRefresh(url){
			$("#w2ui-popup #hzInfo").text('');
			$.get("hcConsole/"+url, hzLockOnloadData);
		}
		// performance
		function hzPerformanceOnloadData(data,status){
			$("#w2ui-popup #tabsContentTimestamp").text(data.timestamp);
			var json=JSON.parse(data.performance);
			$("#w2ui-popup #hzInfo").text(JSON.stringify(json,null,2));
		}
		function hzPerformanceOnRefresh(url){
			$("#w2ui-popup #hzInfo").text('');
			$.get("hcConsole/"+url, hzPerformanceOnloadData);
		}
		// delete
		function hzDeleteOnloadData(data,status){
			$("#w2ui-popup #tabsContentTimestamp").text(data.timestamp);
			$("#w2ui-popup #hzInfo").text(data.result);
		}
		function hzDeleteOnRefresh(url){
			$("#w2ui-popup #hzInfo").text('');
			$.get("hcConsole/"+url, hzDeleteOnloadData);
		}
		/*]]>*/
	</script>
