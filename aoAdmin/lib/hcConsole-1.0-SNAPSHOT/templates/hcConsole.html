<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>HC Console</title>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
<link rel="shortcut icon" href="images/ngtmsIcon.ico" />
<link rel="stylesheet" type="text/css" href="css/w2ui-1.5.min.css" />
<link rel="stylesheet" type="text/css" href="css/hcConsole.css" />
<script src="js/jquery-2.1.4.min.js"></script>
<script src="js/w2ui-1.5.min.js"></script>
<script th:inline="javascript">
/*<![CDATA[*/
$(document).ready(function(){
	w2utils.settings.dataType = 'JSON';
    $('#layout').w2layout({
        name: 'layout',
        panels: [
            { type: 'top',  size: 60, resizable: false , overflow: 'hidden'},
            { type: 'main', style: 'background-color: white;'}
        ]
    });
    var cc = "" + /*[[${hcceEnv.currentGroupName}]]*/ + "";
    var dd = "" + /*[[${hcceEnv.nodeName} ]]*/ + "";
    console.log(cc);
    w2ui['layout'].content('top', '<div id="title">HC Console<div id="nodeAttr">'+cc+'-'+dd+'</div></div>');
    w2ui['layout'].content('main', '<div id="tabs"></div><div id="tabsContent"></div>');
	// tabs
	$('#tabs').w2tabs({
        name     : 'tabs',
        active: 'hzMember',
        tabs: [
            { id: 'hzMember', caption: 'Hz Members' },
            { id: 'hzDump', caption: 'Hz Dump' },
            { id: 'sysPerfLog', caption: 'SysPerfLog' },
//            { id: 'setting', caption: 'Setting' },
//            { id: 'sms', caption: 'SmsTester' },
//            { id: 'benchmark', caption: 'Benchmark' },
            { id: 'hzConfig', caption: 'Hz Config' }
//            { id: 'version', caption: 'Version' }
        ]
    });

	$('#tabsContent').load("hcConsole/tabsContent",function(){
		w2ui['tabs'].onClick= function (event) {
			//console.log(event);
        	showTabContent(event.target+"Tab");
        }
	});
});
/*]]>*/
</script>
</head>
<body>
<div id="layout"></div>
</body>
</html>
