<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<title>登入軟體</title>
<link rel="stylesheet" type="text/css" th:href="@{/css/1920.css}"
	media="screen and (min-width: 1920px)" />
<link rel="stylesheet" type="text/css" th:href="@{/css/1600.css}"
	media="screen and (min-width: 1600px) and (max-width: 1919px)" />
<link rel="stylesheet" type="text/css" th:href="@{/css/1366.css}"
	media="screen and (min-width: 1366px) and (max-width: 1599px)" />
<link rel="stylesheet" type="text/css" th:href="@{/css/1280.css}"
	media="screen and (max-width: 1365px)" />
<style type="text/css">
.code {
	font-family: Arial;
	font-style: italic;
	color: blue;
	font-size: 30px;
	border: 0;
	padding: 2px 3px;
	letter-spacing: 3px;
	font-weight: bolder;
	float: left;
	cursor: pointer;
	width: 87px;
	height: 30px;
	line-height: 30px;
	text-align: center;
	vertical-align: middle;
}

a {
	text-decoration: none;
	font-size: 12px;
	color: #288bc4;
}

a:hover {
	text-decoration: underline;
}

html, body {
	margin: 0;
	padding: 0;
	height: 100%;
	border: none;
}

body {
	background-color: #d4e3e9;
	font-family: "Microsoft MHei", "Noto Sans CJK TC Medium"
}
</style>
<script th:src="@{/js/jquery-3.5.1.min.js}" type="text/javascript"></script>
<script type="text/javascript" th:src="@{/js/login.js}"></script>
</head>
<body onLoad="createCode()">
	<div class="loginbg">
		<div class="title">
			<div class="logintable">
				<div class="logincontent">
					<form name="loginForm" method="post"
						action="j_spring_security_check" onkeydown='keyDown()'>
						<input type="hidden" name="error" />
						<table border="0" cellpadding="0" cellspacing="5">
							<tr>
								<td align="right">帳號</td>
								<td colspan="3" align="left"><input type="text" id="username"
									name="username" size="20" /></td>
							</tr>
							<tr>
								<td align="right">密碼</td>
								<td colspan="3" align="left"><input type="password"
									name="password" size="20" /></td>
							</tr>
							<tr>
								<td align="right">驗證碼</td>
								<td align="left"><input type="text" id="inputCode" size="4" style="width: 62px" /></td>
								<td>
									<img class="code" id="validateCode" onClick="createCode()" src=""></img>
								</td>
								<td><a href="#" onClick="createCode()">換一組</a></td>
							</tr>
							<tr>
								<td colspan="2" align="center"><a href="#"
									onmouseout="MM_swapImgRestore()"
									onmouseover="MM_swapImage('Image1','','/images/login_button_on.png',1)"
									onclick="login()" value="Login"> <img
										th:src="@{/images/login_button_off.png}" alt="登入"
										name="Image1" width="52" height="50" border="0" id="Image1" />
								</a></td>
								<td colspan="2"><table border="0" cellpadding="0"
										cellspacing="0">
										<tr>
											<td><a href="#" onmouseout="MM_swapImgRestore()"
												onmouseover="MM_swapImage('Image2','','/images/pwdReset_button_on.png',1)"
												onclick="#"> <img
													th:src="@{/images/pwdReset_button_off.png}" alt="忘記密碼"
													name="Image2" width="85" height="23" border="0" id="Image2" />
											</a></td>
										</tr>
										<tr>
											<td><a href="#" onmouseout="MM_swapImgRestore()"
												onmouseover="MM_swapImage('Image3','','/images/accountApply_on.png',1)"
												onclick="#"> <img
													th:src="@{/images/accountApply_off.png}" alt="帳號申請"
													name="Image3" width="85" height="23" border="0" id="Image3" />
											</a></td>
										</tr>
									</table></td>
							</tr>
							<tr>
								<td id="errorMsg" colspan="4"><strong><font color="red"></font></strong></td>
							</tr>
						</table>
					</form>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
