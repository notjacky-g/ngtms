<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
        <style>
            .header {
                width: 100px;
                background: #F2F3F1;
                padding: .75pt .75pt .75pt .75pt;
            }

            .cell {
                width: 500px;
                padding:.75pt .75pt .75pt .75pt;
            }
        </style>
    </head>
    <body>
        <div align="center">
            <table border="1" cellspacing="0" cellpadding="0" style="width: 600px; border-collapse: collapse">
                <tbody>
                    <tr>
                        <td class="header"><p style="margin-left:7.5pt">登入帳號</p></td>
                        <td class="cell"><p style="margin-left:7.5pt">${login}</p></td>
                    </tr>
                    <tr>
                        <td class="header"><p style="margin-left:7.5pt">帳號名稱</p></td>
                        <td class="cell"><p style="margin-left:7.5pt">${name}</p></td>
                    </tr>
                </tbody>
            </table>
        </div>
        <ol style="width: 600px; margin-left: auto; margin-right: auto;">
            <li>手機需安裝 Google Authenticator</li>
            <li>開啟 Google Authenticator 點選 [+] 然後選擇下面其中一種方式新增
                <ol>
                    <li><span>[掃描 QR 圖碼] 掃描下面的二維條碼</span></li>
                    <li><span style="font-weight: bold;">或</span>[輸入設定金鑰] 輸入下面的金鑰</li>
                </ol>
            </li>
        </ol>
        <div align="center">
            <p>金鑰：${secretCode}</p>
            <img src="cid:qrcode.png" alt="${secretCode}" />
        </div>
        <p align="center" style="text-align:center">注意：本郵件是由系統產生與發送，請勿直接回覆。</p>
    </body>
</html>
