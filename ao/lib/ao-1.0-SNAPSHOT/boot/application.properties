#spring.jpa.hibernate.naming.physical-strategy=com.hwacom.ngtms.frameworkcontext.SnakeCaseNamingStrategy

# http://docs.spring.io/spring-boot/docs/current-SNAPSHOT/reference/html/common-application-properties.html
# HTTP encoding (HttpEncodingProperties)
 # Charset of HTTP requests and responses. Added to the "Content-Type" header if not set explicitly.
spring.http.encoding.charset=UTF-8
# Enable http encoding support.
spring.http.encoding.enabled=true
# Force the encoding to the configured charset on HTTP requests and responses.
spring.http.encoding.force=true
# Force the encoding to the configured charset on HTTP requests. Defaults to true when "force" has not been specified.
spring.http.encoding.force-request=true
# Force the encoding to the configured charset on HTTP responses.
spring.http.encoding.force-response=true
#spring.http.encoding.mapping= # Locale to Encoding mapping.

# PROFILES
# Comma-separated list (or list if using YAML) of active profiles.
spring.profiles.active=ao
#spring.profiles.include= # Unconditionally activate the specified comma separated profiles (or list of profiles if using YAML).

#switch the default error page off which will restore the default of the servlet container that you are using.
server.error.whitelabel.enabled=false

# spring boot port
server.port = 8090

# override static content
# http://docs.spring.io/spring-boot/docs/current/reference/html/boot-features-developing-web-applications.html
#spring.resources.staticLocations= ###

spring.jpa.properties.hibernate.connection.charSet=UTF-8
spring.jpa.properties.hibernate.hbm2ddl.import_files_sql_extractor=org.hibernate.tool.hbm2ddl.MultipleLinesSqlCommandExtractor

# http://docs.spring.io/spring-boot/docs/current/reference/html/howto-database-initialization.html
#spring.datasource.initialize=false
#spring.datasource.data=classpath:/data-mysql.sql

